# Local Postgres for development. `npm run dev` starts it automatically (scripts/db-up.mjs).
# Port 5433 so it can run beside another Postgres on the default 5432.
# Postgres 17 matches Neon's default, which production uses.
name: mathbridge
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mathbridge
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mathbridge"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped
volumes:
  pgdata:
